name: ci 
on:
  push:
    branches:
      - master 
      - main
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-pip-${{ hashFiles('mkdocs.yml') }}
          path: ~/.cache/pip
          restore-keys: |
            ${{ runner.os }}-pip-
      - run: pip install mkdocs-github-admonitions-plugin mkdocs-material
      - run: mkdocs build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
